# ==============================================================================
# Prometheus Alertmanager Configuration
# Author: Angel Jesse Guevara Silvano
# ==============================================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'tier', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'sre-incident-handler'
  routes:
    - match:
        severity: critical
      receiver: 'sre-pagerduty-webhook'
      continue: true

receivers:
  - name: 'sre-incident-handler'
    webhook_configs:
      - url: 'http://localhost:5001/api/v1/alerts'
        send_resolved: true

  - name: 'sre-pagerduty-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/api/v1/critical-alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
